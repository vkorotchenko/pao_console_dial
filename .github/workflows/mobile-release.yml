# Mobile app release pipeline.
# Triggered by pushing a tag matching `mobile-v*` (e.g. `mobile-v0.3.3`).
# Builds a signed Android APK and publishes a GitHub Release containing
# `pao-console-mobile-<version>.apk` plus a SHA256 checksum file.

name: Mobile App Release

on:
  push:
    tags:
      - 'mobile-v*'

permissions:
  contents: write

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        run: |
          cd mobile
          npm ci

      - name: Derive versionName and versionCode from tag
        # Strip the `mobile-v` prefix, reject prerelease tags, and compute a
        # monotonic versionCode using: MAJOR*10000 + MINOR*100 + PATCH.
        # Decode formula: PATCH = code % 100, MINOR = (code/100) % 100, MAJOR = code/10000.
        # Examples: 0.3.3 -> 303; 1.0.0 -> 10000; 2.5.17 -> 20517.
        run: |
          VERSION="${GITHUB_REF_NAME#mobile-v}"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease tags not supported"
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "version must be MAJOR.MINOR.PATCH (got: $VERSION)"
            exit 1
          fi
          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"
          VERSION_CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"
          echo "Resolved versionName=${VERSION} versionCode=${VERSION_CODE}"

      - name: Decode release keystore
        # base64 -d on Linux runners; the workspace is ephemeral but we still
        # delete the file at the end of the job as a defensive habit.
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > mobile/android/app/paoconsole-release.jks
          if [ ! -s mobile/android/app/paoconsole-release.jks ]; then
            echo "Decoded keystore is empty — check ANDROID_KEYSTORE_BASE64 secret."
            exit 1
          fi

      - name: Build signed release APK
        # Uses Gradle's `android.injected.signing.*` properties to override the
        # signingConfig at the command line. Combined with -PversionName /
        # -PversionCode (consumed by build.gradle), this produces a fully
        # signed APK without committing any signing config to the repo.
        run: |
          cd mobile/android
          ./gradlew :app:assembleRelease \
            -PversionName="${VERSION}" \
            -PversionCode="${VERSION_CODE}" \
            -Pandroid.injected.signing.store.file="${GITHUB_WORKSPACE}/mobile/android/app/paoconsole-release.jks" \
            -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}" \
            --no-daemon

      - name: Stage release artifacts
        # build.gradle renames the APK to `PaoConsole-<versionName>.apk` via
        # outputFileName. We rename to the canonical release filename and
        # write a SHA256 checksum next to it (`<hex>  <filename>` so that
        # `sha256sum -c` works from the dist/ dir).
        run: |
          mkdir -p dist
          APK_SRC=$(find mobile/android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)
          if [ -z "$APK_SRC" ]; then
            echo "No APK found in release output dir."
            ls -la mobile/android/app/build/outputs/apk/release || true
            exit 1
          fi
          APK_DST="dist/pao-console-mobile-${VERSION}.apk"
          cp "$APK_SRC" "$APK_DST"
          ( cd dist && sha256sum "pao-console-mobile-${VERSION}.apk" > "pao-console-mobile-${VERSION}.apk.sha256" )
          ls -lh "$APK_DST" "${APK_DST}.sha256"

      - name: Write build summary
        run: |
          APK="dist/pao-console-mobile-${VERSION}.apk"
          SIZE_BYTES=$(stat -c%s "$APK")
          SIZE_MB=$(awk "BEGIN { printf \"%.2f\", ${SIZE_BYTES} / 1048576 }")
          DIGEST=$(awk '{print $1}' "${APK}.sha256")
          {
            echo "## PaoConsole Mobile ${VERSION}"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| versionName | \`${VERSION}\` |"
            echo "| versionCode | \`${VERSION_CODE}\` |"
            echo "| Tag | \`${GITHUB_REF_NAME}\` |"
            echo "| APK | \`pao-console-mobile-${VERSION}.apk\` |"
            echo "| Size | ${SIZE_BYTES} bytes (${SIZE_MB} MiB) |"
            echo "| SHA256 | \`${DIGEST}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: PaoConsole Mobile ${{ env.VERSION }}
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            dist/pao-console-mobile-${{ env.VERSION }}.apk
            dist/pao-console-mobile-${{ env.VERSION }}.apk.sha256

      - name: Wipe keystore from workspace
        # Runs always so a failed build still scrubs the decoded keystore.
        if: always()
        run: |
          rm -f mobile/android/app/paoconsole-release.jks
