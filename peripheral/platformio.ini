
[env:esp32-s3-devkitc-1]
; Pinned to platform 7.0.1 → arduino-esp32 core 2.0.17 / NimBLE-Arduino 1.x.
; This matches the API surface the current source is backported against:
;   - Arduino_GFX vendored at 1.5.7 (pre-`esp32-hal-periman.h`)
;   - LEDC uses core-2.x two-call form (`ledcSetup` + `ledcAttachPin`)
;   - `feedWatchdog()` gated on `esp_task_wdt_status`
; Decision #59's core 3.x migration is deferred (NOT cancelled). Path B
; (core 3.x migration) is the follow-up — see decisions inbox for the
; migration plan. Without this pin, local resolves to 53.x (core 3.x) and
; CI resolves to 7.0.1 (core 2.x), and the source can't satisfy both.
; controller/platformio.ini and charger/platformio.ini have the same drift
; and need the same pin — tracked as a separate follow-up.
platform = espressif32 @ 7.0.1
board = esp32-s3-devkitc-1
framework = arduino
lib_ldf_mode=deep

extra_scripts = pre:scripts/gen_version.py

lib_deps =
    TFT_eSPI
    fbiego/ESP32Time@^2.0.4
    mathertel/RotaryEncoder@^1.5.3
    bitbank2/PNGdec@^1.0.1
    h2zero/NimBLE-Arduino@^1.4.2

build_flags =
    -D USE_NIMBLE
    -D BOARD_HAS_PSRAM

board_build.arduino.memory_type = qio_opi
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
; OTA partitioning: 16 MB flash, two ~3 MB app slots, see partitions.csv.
; First flash MUST be over USB (otadata + new layout); subsequent flashes
; can be OTA once Phase 5 ships.
board_build.partitions = partitions.csv
board_build.extra_flags =
    -D BOARD_HAS_PSRAM
