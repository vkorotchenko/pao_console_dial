
[env:esp32-s3-devkitc-1]
; Pinned to platform 53.03.13 -> arduino-esp32 core 3.x (Decision #59's
; original target). This dial's ESP32-S3 silicon's bootloader is
; incompatible with core 2.x: empirically the 7.0.1 and 6.10.0 platform
; pins (both core 2.x) silently loop in second-stage init on this chip,
; while 53.x boots cleanly. The earlier core-2.x backports (LEDC two-call
; API, Arduino_GFX 1.5.7 vendored downgrade) are reverted in the same
; commit that introduced this pin.
;
; NOTE: controller/platformio.ini and charger/platformio.ini still need
; their own platform pin decision -- they target different boards and may
; be on core 2.x. Handled as a separate ticket.
platform = espressif32 @ 53.03.13
board = esp32-s3-devkitc-1
framework = arduino
lib_ldf_mode=deep

extra_scripts = pre:scripts/gen_version.py

lib_deps =
    TFT_eSPI
    fbiego/ESP32Time@^2.0.4
    mathertel/RotaryEncoder@^1.5.3
    bitbank2/PNGdec@^1.0.1
    h2zero/NimBLE-Arduino@^1.4.2

build_flags =
    -D USE_NIMBLE
    -D BOARD_HAS_PSRAM

board_build.arduino.memory_type = qio_opi
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
; OTA partitioning: 16 MB flash, two ~3 MB app slots, see partitions.csv.
; First flash MUST be over USB (otadata + new layout); subsequent flashes
; can be OTA once Phase 5 ships.
board_build.partitions = partitions.csv
board_build.extra_flags =
    -D BOARD_HAS_PSRAM
