
[env:esp32-s3-devkitc-1]
; pioarduino community fork, release 53.03.13 (arduino-esp32 core 3.x).
; URL form is required: version 53.x does NOT exist in the official
; platformio/espressif32 registry, so `espressif32 @ 53.03.13` won't
; resolve in CI. Pinned here because the dial's ESP32-S3 silicon is
; incompatible with the bootloader shipped by the official platform
; 7.0.1 (silent boot loop, confirmed on hardware).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_ldf_mode=deep

extra_scripts = pre:scripts/gen_version.py

lib_deps =
    TFT_eSPI
    fbiego/ESP32Time@^2.0.4
    mathertel/RotaryEncoder@^1.5.3
    bitbank2/PNGdec@^1.0.1
    h2zero/NimBLE-Arduino@^1.4.2

build_flags =
    -D USE_NIMBLE
    -D BOARD_HAS_PSRAM
    ; OTA IWDT investigation (Option A — DOES NOT WORK with pioarduino 53.03.13):
    ; The pre-compiled IDF library blob at
    ;   framework-arduinoespressif32-libs/esp32s3/qio_opi/include/sdkconfig.h
    ; hard-codes CONFIG_ESP_INT_WDT_TIMEOUT_MS=300 and the pre-built libary
    ; wins over any -D flag.  The compiler emits a "redefined" warning at build
    ; time (harmless) but the runtime IWDT timeout stays 300 ms.  Raising this
    ; value requires rebuilding the IDF from source with a custom sdkconfig —
    ; not practical with the binary blob platform.
    ;
    ; Left here as documentation: to actually raise the IWDT timeout you must
    ; either (a) switch to a custom IDF build, or (b) implement Option C (writer
    ; task) so Update.write() never holds the cache disabled longer than 300 ms
    ; inside a single call.
    ;
    ; Option C escalation path: create a FreeRTOS writer task at priority 1
    ; (below NimBLE host task at ~3–4).  BLE chunk callbacks enqueue raw bytes
    ; to a FreeRTOS queue; the writer task dequeues and calls Update.write().
    ; Flash latency is fully decoupled from BLE event handling and the IWDT
    ; cannot fire because the cache-disabled window (per individual write call)
    ; remains < 300 ms even for large chunks.
    -D CONFIG_ESP_INT_WDT_TIMEOUT_MS=2000

board_build.arduino.memory_type = qio_opi
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv
board_build.extra_flags =
    -D BOARD_HAS_PSRAM
monitor_filters = esp32_exception_decoder
