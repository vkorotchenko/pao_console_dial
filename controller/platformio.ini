; PlatformIO Project Configuration File
;
; Controller firmware — Adafruit Feather ESP32 V2.
; Stream 1 (Decision #57): bare SAMD21 → ESP32 port.
; Stream 3 (this): OTA scaffolding — partition table, version stamping,
;   NimBLE BLE service (0x27B1), OTA state machine.

[env:adafruit_feather_esp32_v2]
platform = espressif32
board = adafruit_feather_esp32_v2
framework = arduino
monitor_speed = 115200

extra_scripts = pre:scripts/gen_version.py

; OTA partitioning: 8 MB flash, two 3 MB app slots, see partitions.csv
; Layout mirrors charger/partitions.csv byte-for-byte (Decision #62).
board_build.partitions = partitions.csv
board_upload.flash_size = 8MB

; Keep deep LDF mode so the existing in-tree libraries under controller/lib/
; (Adafruit_GPS, CAN_BUS_Shield) and the project src tree are still discovered
; transitively. The two libraries are pure-Arduino and portable to ESP32 —
; verified: no SAMD21 register access, no SoftwareSerial fallback on ESP32
; (Adafruit_GPS gates SoftwareSerial behind ARDUINO_ARCH_AVR / ESP8266 only).
lib_ldf_mode = deep
lib_extra_dirs =
    /lib

lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.2
    Preferences
